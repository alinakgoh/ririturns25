<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>riri's 25 for 25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root{
    --bg-1: #fffaf0;
    --bg-2: #fffaf0;
    --card: #fffdf8;
    --ink: #2e2a24;
    --ink-dim: rgba(46,42,36,0.6);
    --coral: #ff8c69;
    --gold: #ffc857;
    --rose: #ff6f91;
    --seafoam: #5fd1c0;
    --lavender: #b296ff;
    --accent: #2f7d6f;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--bg-1);
    color: var(--ink);
    font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  h1, h2, .display{
    font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  .intro-screen{
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 28px;
    background: var(--bg-1);
    cursor: pointer;
    transition: opacity 0.30s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .intro-screen.hidden{
    opacity: 0;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce){
    .intro-screen{ transition: none; }
  }

  .intro-content{
    width: 100%;
    max-width: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .intro-text{
    font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: clamp(1rem, 4.5vw, 1.3rem);
    font-weight: 500;
    line-height: 1.45;
    width: 100%;
    text-align: center;
    margin: 0;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .intro-text.fade{
    opacity: 0;
    transform: translateY(12px);
  }

  @media (prefers-reduced-motion: reduce){
    .intro-text{ transition: none; }
  }

  .intro-dots{
    display: flex;
    gap: 6px;
    margin-top: 22px;
  }

  .intro-dots span{
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(46,42,36,0.18);
  }

  .intro-dots span.active{
    background: var(--ink);
  }

  .intro-footer{
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 26px;
    margin-top: 22px;
  }

  .intro-back{
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 16px;
    line-height: 1;
    padding: 6px;
    margin: 0;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .intro-back.visible{
    opacity: 1;
    pointer-events: auto;
  }

  .intro-skip{
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 11px;
    line-height: 1;
    padding: 6px;
    margin: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .intro-skip:hover,
  .intro-skip:focus-visible{
    color: var(--ink);
  }

  .intro-hint{
    margin: 0;
    font-size: 11px;
    color: var(--ink-dim);
    text-align: center;
  }

  @media (min-width: 640px){
    .intro-content{ max-width: 380px; }
  }

  .hero{
    padding: 48px 20px 20px;
    text-align: center;
  }

  .hero .eyebrow{
    font-size: 11px;
    color: var(--ink-dim);
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }

  .hero h1{
    font-size: clamp(1.6rem, 8vw, 2.4rem);
    font-weight: 700;
    line-height: 1;
    margin: 0;
    color: var(--ink);
  }

  .hero p.sub{
    max-width: 260px;
    margin: 10px auto 0;
    font-size: 12px;
    color: var(--ink-dim);
    line-height: 1.5;
  }

  .field{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px 14px;
    width: 100%;
    max-width: 720px;
    margin: 28px auto 0;
    padding: 0 4px 48px;
  }

  @media (min-width: 480px) and (max-width: 639px){
    .field{ grid-template-columns: repeat(4, 1fr); }
  }

  @media (min-width: 640px){
    .field{
      grid-template-columns: repeat(5, 1fr);
      gap: 30px 22px;
      margin-top: 36px;
    }
  }

  .bonus-section{
    margin-top: 100px;
    padding: 0 24px;
  }

  .bonus-text{
    max-width: 480px;
    margin: 0 auto;
    text-align: center;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--ink);
  }

  @media (min-width: 640px){
    .bonus-section{ margin-top: 140px; }
    .bonus-text{ font-size: 18px; max-width: 540px; }
  }

  .polaroid{
    position: relative;
    width: 100%;
    background: var(--card);
    border: 1px solid rgba(46,42,36,0.06);
    border-radius: 3px;
    padding: 7px 7px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    box-shadow:
      0 1px 1px rgba(35,25,10,0.22),
      0 8px 12px -4px rgba(35,25,10,0.28),
      0 22px 34px -12px rgba(35,25,10,0.4);
    -webkit-tap-highlight-color: transparent;
  }

  .polaroid::before{
    content: "";
    position: absolute;
    top: -9px;
    left: 50%;
    width: 42px;
    height: 15px;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 3px 4px rgba(35,25,10,0.18);
    transform: translateX(-50%) rotate(-3deg);
    pointer-events: none;
  }

  .polaroid:active{ filter: brightness(0.97); }

  .polaroid:focus-visible{
    outline: 3px solid var(--ink);
    outline-offset: 3px;
  }

  .polaroid-photo{
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 1px;
    background: linear-gradient(135deg, var(--lavender), var(--seafoam));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .polaroid-photo img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .polaroid-photo .fallback-initial{
    font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 700;
    color: rgba(20,14,38,0.55);
  }

  .polaroid-caption{
    margin-top: 8px;
    font-size: 10px;
    font-weight: 600;
    color: var(--ink);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .polaroid.opened{
    opacity: 0.55;
  }

  .polaroid.opened::after{
    content: "";
    position: absolute;
    bottom: 7px;
    right: 9px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--ink);
  }

  .modal-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(10,8,20,0.72);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .modal-backdrop.show{
    opacity: 1;
    pointer-events: auto;
  }

  .modal{
    background: linear-gradient(160deg, #fffdf8, #f2e8d2);
    width: 100%;
    max-width: 480px;
    border-radius: 24px 24px 0 0;
    padding: 28px 24px 36px;
    transform: translateY(24px);
    transition: transform 0.25s ease;
    max-height: 82vh;
    overflow-y: auto;
    box-shadow: 0 -8px 30px rgba(35,25,10,0.25);
  }

  .modal-backdrop.show .modal{
    transform: translateY(0);
  }

  .modal .num{
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    text-align: center;
    margin: 0 0 14px;
  }

  .modal-photo{
    width: 140px;
    height: 140px;
    margin: 0 auto 16px;
    border-radius: 6px;
    overflow: hidden;
    background: linear-gradient(135deg, var(--lavender), var(--seafoam));
  }

  .modal-photo img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .modal-photo.hidden{
    display: none;
  }

  .field-label{
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 6px;
  }

  .modal-voice{
    margin-bottom: 18px;
  }

  .modal-voice.hidden{
    display: none;
  }

  .modal p.message{
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 18px;
    white-space: pre-wrap;
    color: var(--ink);
  }

  .modal .media-block{
    margin-bottom: 16px;
  }

  .modal .media-block iframe{
    width: 100%;
    border: none;
    border-radius: 12px;
  }

  .modal a.song-link{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
  }

  .modal audio{
    width: 100%;
  }

  .modal .close-btn{
    display: block;
    margin: 20px auto 0;
    background: rgba(46,42,36,0.08);
    color: var(--ink);
    border: none;
    padding: 10px 24px;
    border-radius: 999px;
    font-size: 12px;
    font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    cursor: pointer;
  }

  .empty-note{
    color: var(--ink-dim);
    font-style: italic;
    font-size: 13px;
  }

  @media (min-width: 640px){
    .hero{ padding: 72px 20px 24px; }
    .hero p.sub{ max-width: 340px; font-size: 13px; }

    .modal-backdrop{ align-items: center; }
    .modal{
      border-radius: 24px;
      transform: translateY(12px) scale(0.98);
    }
    .modal-backdrop.show .modal{ transform: translateY(0) scale(1); }
    .modal p.message{ font-size: 15px; }
    .field-label{ font-size: 15px; }
  }

</style>
</head>
<body>

  <div class="intro-screen" id="introScreen" role="button" tabindex="0" aria-label="Tap to continue">
    <div class="intro-content">
      <p class="intro-text" id="introText"></p>
      <div class="intro-dots" id="introDots"></div>
      <div class="intro-footer">
        <button class="intro-back" id="introBack" type="button" aria-label="Go back">←</button>
        <p class="intro-hint" id="introHint">tap to continue</p>
        <button class="intro-skip" id="introSkip" type="button" aria-label="Skip intro">skip to end</button>
      </div>
    </div>
  </div>

  <div class="hero">
    <h1 id="heroName" class="display">25 for 25</h1>
    <p class="sub" id="heroSub">happy birthday riazul!</p>
  </div>

  <div class="field" id="field"></div>

  <div class="bonus-section">
    <p class="bonus-text">ok i know i said 25 but there are too many people who love you so here's a little bonus from your family</p>
    <div class="field" id="bonusField"></div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalNum">
      <p class="num" id="modalNum"></p>
      <div class="modal-photo hidden" id="modalPhoto"></div>
      <div class="modal-voice hidden" id="modalVoiceSection">
        <p class="field-label">a birthday wish:</p>
        <div id="modalVoiceSlot"></div>
      </div>
      <div class="modal-memory">
        <p class="field-label">a treasured memory:</p>
        <p class="message" id="modalMemoryText"></p>
      </div>
      <div class="media-block" id="modalMedia"></div>
      <button class="close-btn" id="modalClose">Close</button>
    </div>
  </div>

<script>

  const BIRTHDAY_NAME = "Riazul";
  const PHOTO_FOLDER = "./photos/";
  const VOICE_FOLDER = "./voice/";

  const FRIENDS = [
    { name: "AJ", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "alina", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "alyssa", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "becs", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "camilla", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "cara", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "emily", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "eva", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "fran", memory: "Write their favourite memory here.", song: "https://open.spotify.com/track/4rYLpaNFzt6pkQnrCvVHUw?si=b951c7fc3ed6433f", voice: "" },
    { name: "hamza", memory: "Write their favourite memory here.", song: "https://open.spotify.com/track/3zpGIFghtnVlwMXWyKW474?si=91fd4835ff3b4739", voice: "" },
    { name: "hazel", memory: "Write their favourite memory here.", song: "https://open.spotify.com/track/0NTMtAO2BV4tnGvw9EgBVq?si=85e73454a8e34ac1", voice: "" },
    { name: "jen", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "katsie", memory: "trauma bonding in the swifty sixties!!!! my first power hour on that silly side bike and riazul coming over mid weights track being like NO YOU GOTS THIS. and ofc all the trauma that continued with the sundays at OC", song: "https://open.spotify.com/track/3hUxzQpSfdDqwM3ZTFQY0K?si=1a824e7802214ab0", voice: "" },
    { name: "lu", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "mel", memory: "Write their favourite memory here.", song: "https://open.spotify.com/track/2YmJZWGcy0yONMCsEKOuVD?si=bce89485d4ac470b", voice: "" },
    { name: "mohim", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "perdi", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "queenie", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "shanti", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "soph", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "steph", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "tala", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "vi", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "vivienne", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "zeshan", memory: "when you taught the Brown Game Strong class. You looked so happy to teach a class with those songs in front of so many South Asians. It was wonderful to see", song: "https://open.spotify.com/track/4kte3OcW800TPvOVgrLLj8?si=e8d375edbb314185", voice: "" }
  ];

  const FAMILY = [
    { name: "nazma", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "noah", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "Family 3", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "Family 4", memory: "Write their favourite memory here.", song: "", voice: "" },
    { name: "Family 5", memory: "Write their favourite memory here.", song: "", voice: "" }
  ];

  document.getElementById('heroSub').textContent =
    `happy birthday ${BIRTHDAY_NAME.toLowerCase()}!`;

  const INTRO = [
    `hey riazul`,
    `a little birdie told me you're 25`,
    `how's that pre-frontal cortex feeling?`,
    `you don't have to answer that.`,
    `anyway...`,
    `it turns out some friends and loved ones have birthday wishes to share with you...`,
    `25 to be exact.`,
    `if you just said "wtf" for the tenth time, we're right on track`,
    `anyway, ON TO THE MESSAGES!`,
    `oh and -`,
    `happy birthday baby boy. we love you so endlessly and cannot wait to cheer you on in all the amazing things you'll do in your next lap around the sun.`
  ];

  const introScreen = document.getElementById('introScreen');
  const introText = document.getElementById('introText');
  const introHint = document.getElementById('introHint');
  const introDots = document.getElementById('introDots');
  const introBack = document.getElementById('introBack');
  const introSkip = document.getElementById('introSkip');
  let introIndex = 0;

  INTRO.forEach(() => {
    const dot = document.createElement('span');
    introDots.appendChild(dot);
  });

  const prefersReducedMotionForIntro = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function renderIntro(){
    introText.textContent = INTRO[introIndex];
    introHint.textContent = introIndex === INTRO.length - 1
      ? 'tap to open your messages'
      : 'tap to continue';
    Array.from(introDots.children).forEach((dot, i) => {
      dot.classList.toggle('active', i === introIndex);
    });
    introBack.classList.toggle('visible', introIndex > 0);
  }

  function stepIntro(newIndex){
    if(prefersReducedMotionForIntro){
      introIndex = newIndex;
      renderIntro();
      return;
    }
    introText.classList.add('fade');
    setTimeout(() => {
      introIndex = newIndex;
      renderIntro();
      introText.classList.remove('fade');
    }, 150);
  }

  function advanceIntro(){
    if(introIndex >= INTRO.length - 1){
      introScreen.classList.add('hidden');
      return;
    }
    stepIntro(introIndex + 1);
  }

  function goBackIntro(){
    if(introIndex <= 0) return;
    stepIntro(introIndex - 1);
  }

  introBack.addEventListener('click', (e) => {
    e.stopPropagation();
    goBackIntro();
  });

  introSkip.addEventListener('click', (e) => {
    e.stopPropagation();
    introScreen.classList.add('hidden');
  });

  introScreen.addEventListener('click', advanceIntro);
  introScreen.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight'){
      e.preventDefault();
      advanceIntro();
    } else if(e.key === 'ArrowLeft'){
      e.preventDefault();
      goBackIntro();
    }
  });

  renderIntro();

  const field = document.getElementById('field');
  const bonusField = document.getElementById('bonusField');

  function spotifyEmbed(url){
    const m = url.match(/open\.spotify\.com\/(track|album|playlist)\/([a-zA-Z0-9]+)/);
    if(!m) return null;
    return `<iframe src="https://open.spotify.com/embed/${m[1]}/${m[2]}" height="80" allow="encrypted-media"></iframe>`;
  }

  function youtubeEmbed(url){
    let id = null;
    let m = url.match(/youtu\.be\/([a-zA-Z0-9_-]+)/);
    if(m) id = m[1];
    if(!id){
      m = url.match(/[?&]v=([a-zA-Z0-9_-]+)/);
      if(m) id = m[1];
    }
    if(!id){
      m = url.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]+)/);
      if(m) id = m[1];
    }
    if(!id) return null;
    return `<iframe src="https://www.youtube.com/embed/${id}" height="200" allow="autoplay; encrypted-media"></iframe>`;
  }

  function buildMedia(item){
    let html = '';
    if(item.song){
      const embed = spotifyEmbed(item.song) || youtubeEmbed(item.song);
      if(embed){
        html += `<div class="media-block">${embed}</div>`;
      } else {
        html += `<div class="media-block"><a class="song-link" href="${item.song}" target="_blank" rel="noopener">Listen to the song ↗</a></div>`;
      }
    }
    return html;
  }

  function attachVoice(sectionEl, slotEl, item){
    const audio = document.createElement('audio');
    audio.controls = true;
    slotEl.appendChild(audio);

    if(item.voice){
      audio.src = item.voice;
      return;
    }

    const exts = ['mp3', 'm4a', 'wav', 'ogg'];
    let attempt = 0;

    function tryNext(){
      if(attempt >= exts.length){
        sectionEl.classList.add('hidden');
        return;
      }
      audio.src = `${VOICE_FOLDER}${encodeURIComponent(item.name.toLowerCase())}.${exts[attempt]}`;
      attempt++;
    }

    audio.addEventListener('error', tryNext);
    tryNext();
  }

  const backdrop = document.getElementById('modalBackdrop');
  const modalNum = document.getElementById('modalNum');
  const modalPhoto = document.getElementById('modalPhoto');
  const modalVoiceSection = document.getElementById('modalVoiceSection');
  const modalVoiceSlot = document.getElementById('modalVoiceSlot');
  const modalMemoryText = document.getElementById('modalMemoryText');
  const modalMedia = document.getElementById('modalMedia');
  const closeBtn = document.getElementById('modalClose');

  function openItem(item, btn){
    modalNum.textContent = item.name;

    modalPhoto.innerHTML = '';
    modalPhoto.classList.remove('hidden');
    attachPhoto(modalPhoto, item.name, '2', true);

    modalVoiceSlot.innerHTML = '';
    modalVoiceSection.classList.remove('hidden');
    attachVoice(modalVoiceSection, modalVoiceSlot, item);

    modalMemoryText.textContent = item.memory;
    modalMedia.innerHTML = buildMedia(item);
    backdrop.classList.add('show');
    btn.classList.add('opened');
  }

  function closeModal(){
    backdrop.classList.remove('show');
  }

  closeBtn.addEventListener('click', closeModal);
  backdrop.addEventListener('click', (e) => {
    if(e.target === backdrop) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeModal();
  });

  function attachPhoto(container, name, suffix, optional){
    const exts = ['jpg', 'jpeg', 'png', 'webp'];
    const key = encodeURIComponent(name + suffix);
    const img = document.createElement('img');
    img.alt = name;
    let attempt = 0;

    function tryNext(){
      if(attempt >= exts.length){
        img.remove();
        if(optional){
          container.classList.add('hidden');
        } else {
          const fallback = document.createElement('span');
          fallback.className = 'fallback-initial';
          fallback.textContent = (name.trim()[0] || '?').toUpperCase();
          fallback.style.fontSize = Math.max(16, Math.round(container.clientWidth * 0.32)) + 'px';
          container.appendChild(fallback);
        }
        return;
      }
      img.src = `${PHOTO_FOLDER}${key}.${exts[attempt]}`;
      attempt++;
    }

    img.addEventListener('error', tryNext);
    container.appendChild(img);
    tryNext();
  }

  function buildWall(container, list){
    list.forEach((item, i) => {
      const btn = document.createElement('button');
      btn.className = 'polaroid';
      btn.type = 'button';
      btn.setAttribute('aria-label', `Open ${item.name}'s photo`);
      btn.addEventListener('click', () => openItem(item, btn));

      const photo = document.createElement('span');
      photo.className = 'polaroid-photo';
      attachPhoto(photo, item.name, '1', false);

      const caption = document.createElement('span');
      caption.className = 'polaroid-caption';
      caption.textContent = item.name;

      btn.appendChild(photo);
      btn.appendChild(caption);
      container.appendChild(btn);

      const rotation = (Math.sin(i * 17.233) * 0.5) * 8;
      btn.style.transform = `rotate(${rotation}deg)`;
    });
  }

  buildWall(field, FRIENDS);
  buildWall(bonusField, FAMILY);

</script>
</body>
</html>
