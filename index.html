<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>riri's 25 for 25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf0;--card:#fffdf8;--ink:#2e2a24;--dim:rgba(46,42,36,.6);--sea:#5fd1c0;--lav:#b296ff;--accent:#2f7d6f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}.intro-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 28px;background:var(--bg);cursor:pointer;transition:opacity .3s ease}.intro-screen.hidden{opacity:0;pointer-events:none}.intro-content{width:100%;max-width:380px}.intro-text{font-size:clamp(1rem,4.5vw,1.3rem);font-weight:500;line-height:1.45;margin:0}.intro-dots{display:flex;justify-content:center;gap:6px;margin-top:22px}.intro-dots span{width:5px;height:5px;border-radius:50%;background:#d8d3ca}.intro-dots span.active{background:var(--ink)}.intro-footer{position:relative;min-height:26px;margin-top:22px}.intro-back,.intro-skip{position:absolute;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--dim);cursor:pointer;padding:6px}.intro-back{left:0;opacity:0;pointer-events:none}.intro-back.visible{opacity:1;pointer-events:auto}.intro-skip{right:0;font-size:11px}.intro-hint{margin:0;font-size:11px;color:var(--dim)}.hero{text-align:center;padding:48px 20px 20px}.hero h1{font-size:clamp(1.6rem,8vw,2.4rem);line-height:1;margin:0}.hero p{margin:10px auto 0;font-size:12px;color:var(--dim)}.field{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 14px;width:100%;max-width:720px;margin:28px auto 0;padding:0 4px 48px}@media(min-width:480px){.field{grid-template-columns:repeat(4,1fr)}}@media(min-width:640px){.hero{padding-top:72px}.field{grid-template-columns:repeat(5,1fr);gap:30px 22px;margin-top:36px}}.bonus-section{margin-top:100px;padding:0 24px}.bonus-text{max-width:540px;margin:0 auto;text-align:center;font-size:16px;font-weight:500;line-height:1.5}@media(min-width:640px){.bonus-section{margin-top:140px}.bonus-text{font-size:18px}}.polaroid{position:relative;width:100%;border:1px solid rgba(46,42,36,.06);border-radius:3px;background:var(--card);padding:7px 7px 20px;display:flex;flex-direction:column;align-items:center;cursor:pointer;box-shadow:0 1px 1px rgba(35,25,10,.22),0 8px 12px -4px rgba(35,25,10,.28),0 22px 34px -12px rgba(35,25,10,.4)}.polaroid:before{content:"";position:absolute;top:-9px;left:50%;width:42px;height:15px;background:#ffffff8c;border:1px solid #ffffffb3;box-shadow:0 3px 4px #23190a2e;transform:translateX(-50%) rotate(-3deg);pointer-events:none}.polaroid-photo{width:100%;aspect-ratio:1;overflow:hidden;background:linear-gradient(135deg,var(--lav),var(--sea));display:flex;align-items:center;justify-content:center}.polaroid-photo img{width:100%;height:100%;object-fit:cover;display:block}.fallback-initial{font-weight:700;color:#140e268c}.polaroid-caption{margin-top:8px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.modal-backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:#0a0814b8;opacity:0;pointer-events:none;transition:opacity .2s}.modal-backdrop.show{opacity:1;pointer-events:auto}.modal{width:100%;max-width:480px;max-height:82vh;overflow-y:auto;padding:28px 24px 36px;background:linear-gradient(160deg,#fffdf8,#f2e8d2);border-radius:24px 24px 0 0}.modal .num{text-align:center;font-size:22px;font-weight:700;margin:0 0 14px}.modal-photo{width:140px;height:140px;margin:0 auto 16px;overflow:hidden}.modal-photo img{width:100%;height:100%;object-fit:cover}.hidden{display:none!important}.field-label{font-size:14px;font-weight:700;margin:0 0 6px}.message,.track-note{font-size:14px;line-height:1.6;white-space:pre-wrap}.media-block{margin-bottom:16px}.media-block iframe{width:100%;border:0;border-radius:12px}.song-link{color:var(--accent);font-size:13px}.modal audio{width:100%}.close-btn{display:block;margin:20px auto 0;border:0;border-radius:999px;padding:10px 24px;background:#2e2a2414;color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<div class="intro-screen" id="introScreen" role="button" tabindex="0" aria-label="Tap to continue"><div class="intro-content"><p class="intro-text" id="introText"></p><div class="intro-dots" id="introDots"></div><div class="intro-footer"><button class="intro-back" id="introBack" type="button" aria-label="Go back">←</button><p class="intro-hint" id="introHint">tap to continue</p><button class="intro-skip" id="introSkip" type="button">skip to end</button></div></div></div>
<header class="hero"><h1>25 for 25</h1><p id="heroSub">happy birthday riazul!</p></header>
<div class="field" id="field"></div><section class="bonus-section"><p class="bonus-text">ok i know i said 25 but there are too many people who love you so here's a little bonus from your family</p><div class="field" id="bonusField"></div></section>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true"><p class="num" id="modalNum"></p><div class="modal-photo hidden" id="modalPhoto"></div><div id="modalVoiceSection" class="hidden"><p class="field-label">a birthday wish:</p><div id="modalVoiceSlot"></div></div><p class="field-label">a treasured memory:</p><p class="message" id="modalMemoryText"></p><div id="modalMedia"></div><button class="close-btn" id="modalClose">Close</button></div></div>
<script id="peopleData" type="application/json">{"friends":["AJ","alina","alyssa","becs","camilla","cara","emily","eva","fran","hamza","hazel","jen","katsie","lu","mel","mohim","perdi","queenie","shanti","soph","steph","tala","vi","vivienne","zeshan"],"family":["jamiul","nazma","noah","taslima"]}</script>
<script>
(function(){
'use strict';
const PHOTO_FOLDER='photos/';
const VOICE_FOLDER='voice/';
const fallback='Write their favourite memory here.';
const raw=JSON.parse(document.getElementById('peopleData').textContent);
function makePeople(names){return (Array.isArray(names)?names:[]).map(function(name){return{name:String(name||'').trim()||'friend',memory:fallback,song:'',trackNote:'',voice:''};});}
const FRIENDS=makePeople(raw.friends),FAMILY=makePeople(raw.family);
const intro=['hey riazul',"a little birdie told me you're 25","how's that pre-frontal cortex feeling?",'you don’t have to answer that.','anyway...','it turns out some friends and loved ones have birthday wishes to share with you...','25 to be exact.','if you just said "wtf" for the tenth time, we’re right on track','anyway, ON TO THE MESSAGES!','oh and -','happy birthday baby boy. we love you so endlessly and cannot wait to cheer you on in all the amazing things you’ll do in your next lap around the sun.'];
const screen=document.getElementById('introScreen'),text=document.getElementById('introText'),hint=document.getElementById('introHint'),dots=document.getElementById('introDots'),back=document.getElementById('introBack'),skip=document.getElementById('introSkip');let index=0;
intro.forEach(function(_,i){const dot=document.createElement('span');dot.className=i===0?'active':'';dots.appendChild(dot);});
function renderIntro(){text.textContent=intro[index];hint.textContent=index===intro.length-1?'tap to open your messages':'tap to continue';Array.from(dots.children).forEach(function(dot,i){dot.classList.toggle('active',i===index);});back.classList.toggle('visible',index>0);}
function step(next){index=next;renderIntro();}
screen.addEventListener('click',function(event){if(event.target===back||event.target===skip)return;if(index<intro.length-1)step(index+1);else screen.classList.add('hidden');});back.addEventListener('click',function(event){event.stopPropagation();if(index>0)step(index-1);});skip.addEventListener('click',function(event){event.stopPropagation();screen.classList.add('hidden');});screen.addEventListener('keydown',function(event){if(event.key==='ArrowRight'||event.key==='Enter'||event.key===' '){event.preventDefault();if(index<intro.length-1)step(index+1);else screen.classList.add('hidden');}else if(event.key==='ArrowLeft'&&index>0){step(index-1);}});renderIntro();
function escapeHtml(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');}
function attachPhoto(container,name,suffix,optional){const image=document.createElement('img');image.alt=name;const extensions=['jpg','jpeg','png','webp'];let attempt=0;function next(){if(attempt>=extensions.length){image.remove();if(optional)container.classList.add('hidden');else{const fallbackEl=document.createElement('span');fallbackEl.className='fallback-initial';fallbackEl.textContent=(name.charAt(0)||'?').toUpperCase();container.appendChild(fallbackEl);}return;}image.src=PHOTO_FOLDER+encodeURIComponent(name+suffix)+'.'+extensions[attempt++];}image.addEventListener('error',next);container.appendChild(image);next();}
function attachVoice(section,slot,item){const audio=document.createElement('audio');audio.controls=true;slot.appendChild(audio);const extensions=['mp3','m4a','wav','ogg'];let attempt=0;function next(){if(attempt>=extensions.length){section.classList.add('hidden');return;}audio.src=item.voice||VOICE_FOLDER+encodeURIComponent(item.name.toLowerCase())+'.'+extensions[attempt++];}audio.addEventListener('error',next);next();}
function buildMedia(item){let html='<p class="field-label">a meaningful track:</p>';if(item.trackNote)html+='<p class="track-note">'+escapeHtml(item.trackNote)+'</p>';if(item.song)html+='<div class="media-block"><a class="song-link" href="'+escapeHtml(item.song)+'" target="_blank" rel="noopener">Listen to the song ↗</a></div>';return html;}
const backdrop=document.getElementById('modalBackdrop'),modalNum=document.getElementById('modalNum'),modalPhoto=document.getElementById('modalPhoto'),voiceSection=document.getElementById('modalVoiceSection'),voiceSlot=document.getElementById('modalVoiceSlot'),memoryText=document.getElementById('modalMemoryText'),media=document.getElementById('modalMedia');
function openItem(item){modalNum.textContent=item.name;modalPhoto.innerHTML='';modalPhoto.classList.remove('hidden');attachPhoto(modalPhoto,item.name,'2',true);voiceSlot.innerHTML='';voiceSection.classList.remove('hidden');attachVoice(voiceSection,voiceSlot,item);memoryText.textContent=item.memory;media.innerHTML=buildMedia(item);backdrop.classList.add('show');}
function closeModal(){backdrop.classList.remove('show');}
document.getElementById('modalClose').addEventListener('click',closeModal);backdrop.addEventListener('click',function(event){if(event.target===backdrop)closeModal();});document.addEventListener('keydown',function(event){if(event.key==='Escape')closeModal();});
function buildWall(container,list){list.forEach(function(item,i){const button=document.createElement('button');button.className='polaroid';button.type='button';button.setAttribute('aria-label','Open '+item.name+' photo');button.addEventListener('click',function(){openItem(item);});const photo=document.createElement('span');photo.className='polaroid-photo';attachPhoto(photo,item.name,'1',false);const caption=document.createElement('span');caption.className='polaroid-caption';caption.textContent=item.name;button.append(photo,caption);button.style.transform='rotate('+(Math.sin(i*17.233)*4)+'deg)';container.appendChild(button);});}
buildWall(document.getElementById('field'),FRIENDS);buildWall(document.getElementById('bonusField'),FAMILY);
})();
</script>
</body>
</html>
