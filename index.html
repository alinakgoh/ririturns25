<style>
:root{--bg:#fffaf0;--card:#fffdf8;--ink:#2e2a24;--dim:rgba(46,42,36,.6);--sea:#5fd1c0;--lav:#b296ff;--accent:#2f7d6f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}.intro-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 28px;background:var(--bg);cursor:pointer;transition:opacity .3s ease}.intro-screen.hidden{opacity:0;pointer-events:none}.intro-content{width:100%;max-width:380px}.intro-text{font-size:clamp(1rem,4.5vw,1.3rem);font-weight:500;line-height:1.45;margin:0;transition:opacity .15s ease,transform .15s ease}.intro-text.fade{opacity:0;transform:translateY(12px)}.intro-dots{display:flex;justify-content:center;gap:6px;margin-top:22px}.intro-dots span{width:5px;height:5px;border-radius:50%;background:rgba(46,42,36,.18)}.intro-dots span.active{background:var(--ink)}.intro-footer{position:relative;min-height:26px;margin-top:22px}.intro-back,.intro-skip{position:absolute;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--dim);cursor:pointer;padding:6px}.intro-back{left:0;opacity:0;pointer-events:none}.intro-back.visible{opacity:1;pointer-events:auto}.intro-skip{right:0;font-size:11px}.intro-hint{margin:0;font-size:11px;color:var(--dim)}.hero{text-align:center;padding:48px 20px 20px}.hero h1{font-size:clamp(1.6rem,8vw,2.4rem);line-height:1;margin:0}.hero p{max-width:340px;margin:10px auto 0;font-size:12px;color:var(--dim);line-height:1.5}.field{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 14px;width:100%;max-width:720px;margin:28px auto 0;padding:0 4px 48px}@media(min-width:480px){.field{grid-template-columns:repeat(4,1fr)}}@media(min-width:640px){.hero{padding-top:72px}.field{grid-template-columns:repeat(5,1fr);gap:30px 22px;margin-top:36px}}.bonus-section{margin-top:100px;padding:0 24px}.bonus-text{max-width:540px;margin:0 auto;text-align:center;font-size:16px;font-weight:500;line-height:1.5}@media(min-width:640px){.bonus-section{margin-top:140px}.bonus-text{font-size:18px}}.polaroid{position:relative;width:100%;border:1px solid rgba(46,42,36,.06);border-radius:3px;background:var(--card);padding:7px 7px 20px;display:flex;flex-direction:column;align-items:center;cursor:pointer;box-shadow:0 1px 1px rgba(35,25,10,.22),0 8px 12px -4px rgba(35,25,10,.28),0 22px 34px -12px rgba(35,25,10,.4)}.polaroid:focus-visible{outline:3px solid var(--ink);outline-offset:3px}.polaroid:before{content:"";position:absolute;top:-9px;left:50%;width:42px;height:15px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);box-shadow:0 3px 4px rgba(35,25,10,.18);transform:translateX(-50%) rotate(-3deg);pointer-events:none}.polaroid-photo{width:100%;aspect-ratio:1;overflow:hidden;border-radius:1px;background:linear-gradient(135deg,var(--lav),var(--sea));display:flex;align-items:center;justify-content:center}.polaroid-photo img{width:100%;height:100%;object-fit:cover;display:block}.fallback-initial{font-weight:700;color:rgba(20,14,38,.55)}.polaroid-caption{margin-top:8px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.modal-backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,8,20,.72);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s}.modal-backdrop.show{opacity:1;pointer-events:auto}.modal{width:100%;max-width:480px;max-height:82vh;overflow-y:auto;padding:28px 24px 36px;background:linear-gradient(160deg,#fffdf8,#f2e8d2);border-radius:24px 24px 0 0;transform:translateY(24px);transition:transform .25s;box-shadow:0 -8px 30px rgba(35,25,10,.25)}.modal-backdrop.show .modal{transform:translateY(0)}.modal .num{text-align:center;font-size:22px;font-weight:700;margin:0 0 14px}.modal-photo{width:140px;height:140px;margin:0 auto 16px;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,var(--lav),var(--sea))}.modal-photo img{width:100%;height:100%;object-fit:cover}.modal-photo.hidden,.modal-voice.hidden{display:none}.field-label{font-size:14px;font-weight:700;margin:0 0 6px}.modal p.message,.track-note{font-size:14px;line-height:1.6;white-space:pre-wrap;color:var(--ink)}.modal p.message{margin:0 0 18px}.track-note{margin:0 0 12px}.media-block{margin-bottom:16px}.media-block iframe{width:100%;border:0;border-radius:12px}.song-link{color:var(--accent);font-size:13px;text-decoration:none}.modal audio{width:100%}.close-btn{display:block;margin:20px auto 0;border:0;border-radius:999px;padding:10px 24px;background:rgba(46,42,36,.08);color:var(--ink);cursor:pointer}@media(min-width:640px){.modal-backdrop{align-items:center}.modal{border-radius:24px;transform:translateY(12px) scale(.98)}.modal-backdrop.show .modal{transform:translateY(0) scale(1)}.modal p.message,.track-note{font-size:15px}}
</style>

<script>
const PHOTO_FOLDER='photos/',VOICE_FOLDER='voice/';
const fallbackMemory='Write their favourite memory here.';
function str(v,d=''){return typeof v==='string'?v:d}function normalize(v,i,g){v=v&&typeof v==='object'?v:{};return{name:str(v.name,`${g}-${i+1}`).trim()||`${g}-${i+1}`,memory:str(v.memory,fallbackMemory),song:str(v.song),trackNote:str(v.trackNote),voice:str(v.voice)}}
function read(id,g){try{const v=JSON.parse(document.getElementById(id)?.textContent||'[]');return Array.isArray(v)?v.map((x,i)=>normalize(x,i,g)):[]}catch(e){console.error('Invalid data',id,e);return[]}}
const FRIENDS=read('friendsData','friend'),FAMILY=read('familyData','family');
const intro=['hey riazul',"a little birdie told me you're 25",`how's that pre-frontal cortex feeling?`,'you don\'t have to answer that.','anyway...','it turns out some friends and loved ones have birthday wishes to share with you...','25 to be exact.','if you just said "wtf" for the tenth time, we\'re right on track','anyway, ON TO THE MESSAGES!','oh and -','happy birthday baby boy. we love you so endlessly and cannot wait to cheer you on in all the amazing things you\'ll do in your next lap around the sun.'];
const screen=document.getElementById('introScreen'),text=document.getElementById('introText'),hint=document.getElementById('introHint'),dots=document.getElementById('introDots'),back=document.getElementById('introBack');let introIndex=0;intro.forEach((_,i)=>{const d=document.createElement('span');d.className=i?'':'active';dots.appendChild(d)});function renderIntro(){text.textContent=intro[introIndex];hint.textContent=introIndex===intro.length-1?'tap to open your messages':'tap to continue';[...dots.children].forEach((d,i)=>d.classList.toggle('active',i===introIndex));back.classList.toggle('visible',introIndex>0)}function step(n){text.classList.add('fade');setTimeout(()=>{introIndex=n;renderIntro();text.classList.remove('fade')},150)}screen.onclick=e=>{if(e.target===back||e.target.id==='introSkip')return;introIndex<intro.length-1?step(introIndex+1):screen.classList.add('hidden')};back.onclick=e=>{e.stopPropagation();if(introIndex)step(introIndex-1)};document.getElementById('introSkip').onclick=e=>{e.stopPropagation();screen.classList.add('hidden')};screen.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='Enter'||e.key===' '){e.preventDefault();introIndex<intro.length-1?step(introIndex+1):screen.classList.add('hidden')}if(e.key==='ArrowLeft'&&introIndex)step(introIndex-1)};renderIntro();
function escapeHtml(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function photo(el,name,suffix,optional){const img=document.createElement('img');img.alt=name;const exts=['jpg','jpeg','png','webp'];let i=0;function next(){if(i===exts.length){img.remove();if(optional)el.classList.add('hidden');else{const f=document.createElement('span');f.className='fallback-initial';f.textContent=(name[0]||'?').toUpperCase();el.appendChild(f)}return}img.src=PHOTO_FOLDER+encodeURIComponent(name+suffix)+'.'+exts[i++]}img.onerror=next;el.appendChild(img);next()}
function voice(section,slot,item){const a=document.createElement('audio');a.controls=true;slot.appendChild(a);if(item.voice){a.src=item.voice;return}const exts=['mp3','m4a','wav','ogg'];let i=0;function next(){if(i===exts.length){section.classList.add('hidden');return}a.src=VOICE_FOLDER+encodeURIComponent(item.name.toLowerCase())+'.'+exts[i++]}a.onerror=next;next()}
function media(item){let h='<p class="field-label">a meaningful track:</p>';if(item.trackNote)h+='<p class="track-note">'+escapeHtml(item.trackNote)+'</p>';if(item.song){const m=item.song.match(/open\.spotify\.com\/(track|album|playlist)\/([\w]+)/);if(m)h+=`<div class="media-block"><iframe src="https://open.spotify.com/embed/${m[1]}/${m[2]}" height="80" allow="encrypted-media"></iframe></div>`;else h+=`<div class="media-block"><a class="song-link" href="${escapeHtml(item.song)}" target="_blank" rel="noopener">Listen to the song ↗</a></div>`}return h}
const backdrop=document.getElementById('modalBackdrop'),num=document.getElementById('modalNum'),mp=document.getElementById('modalPhoto'),vs=document.getElementById('modalVoiceSection'),slot=document.getElementById('modalVoiceSlot'),mem=document.getElementById('modalMemoryText'),med=document.getElementById('modalMedia');function openItem(item){num.textContent=item.name;mp.innerHTML='';mp.classList.remove('hidden');photo(mp,item.name,'2',true);slot.innerHTML='';vs.classList.remove('hidden');voice(vs,slot,item);mem.textContent=item.memory;med.innerHTML=media(item);backdrop.classList.add('show')}function close(){backdrop.classList.remove('show')}document.getElementById('modalClose').onclick=close;backdrop.onclick=e=>{if(e.target===backdrop)close()};document.onkeydown=e=>{if(e.key==='Escape')close()};function wall(el,list){list.forEach((item,i)=>{const b=document.createElement('button');b.className='polaroid';b.type='button';b.setAttribute('aria-label',`Open ${item.name}'s photo`);b.onclick=()=>openItem(item);const p=document.createElement('span');p.className='polaroid-photo';photo(p,item.name,'1',false);const c=document.createElement('span');c.className='polaroid-caption';c.textContent=item.name;b.append(p,c);b.style.transform=`rotate(${Math.sin(i*17.233)*4}deg)`;el.appendChild(b)})}document.getElementById('heroSub').textContent='happy birthday riazul!';wall(document.getElementById('field'),FRIENDS);wall(document.getElementById('bonusField'),FAMILY);
</script></body></html>
