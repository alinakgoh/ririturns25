<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>riri's 25 for 25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf0;--card:#fffdf8;--ink:#2e2a24;--dim:rgba(46,42,36,.6);--sea:#5fd1c0;--lav:#b296ff;--accent:#2f7d6f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow-x:hidden}.intro-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 28px;background:var(--bg);cursor:pointer;transition:opacity .3s ease}.intro-screen.hidden{opacity:0;pointer-events:none}.intro-content{width:100%;max-width:380px}.intro-text{font-size:clamp(1rem,4.5vw,1.3rem);font-weight:500;line-height:1.45;margin:0}.intro-dots{display:flex;justify-content:center;gap:6px;margin-top:22px}.intro-dots span{width:5px;height:5px;border-radius:50%;background:#d8d3ca}.intro-dots span.active{background:var(--ink)}.intro-footer{position:relative;min-height:26px;margin-top:22px}.intro-back,.intro-skip{position:absolute;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--dim);cursor:pointer;padding:6px}.intro-back{left:0;opacity:0;pointer-events:none}.intro-back.visible{opacity:1;pointer-events:auto}.intro-skip{right:0;font-size:11px}.intro-hint{margin:0;font-size:11px;color:var(--dim)}.hero{text-align:center;padding:48px 20px 20px}.hero h1{font-size:clamp(1.6rem,8vw,2.4rem);line-height:1;margin:0}.hero p{margin:10px auto 0;font-size:12px;color:var(--dim)}.field{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 14px;width:100%;max-width:720px;margin:28px auto 0;padding:0 4px 48px}@media(min-width:480px){.field{grid-template-columns:repeat(4,1fr)}}@media(min-width:640px){.hero{padding-top:72px}.field{grid-template-columns:repeat(5,1fr);gap:30px 22px;margin-top:36px}}.bonus-section{margin-top:100px;padding:0 24px}.bonus-text{max-width:540px;margin:0 auto;text-align:center;font-size:16px;font-weight:500;line-height:1.5}@media(min-width:640px){.bonus-section{margin-top:140px}.bonus-text{font-size:18px}}#bonusField{justify-content:center}@media(min-width:640px){#bonusField{grid-template-columns:repeat(4,1fr);max-width:560px;margin-left:auto;margin-right:auto}}.polaroid{position:relative;width:100%;border:1px solid rgba(46,42,36,.06);border-radius:3px;background:var(--card);padding:7px 7px 20px;display:flex;flex-direction:column;align-items:center;cursor:pointer;box-shadow:0 1px 1px rgba(35,25,10,.22),0 8px 12px -4px rgba(35,25,10,.28),0 22px 34px -12px rgba(35,25,10,.14)}.polaroid:before{content:"";position:absolute;top:-9px;left:50%;width:42px;height:15px;background:#ffffff8c;border:1px solid #ffffffb3;box-shadow:0 3px 4px #23190a2e;transform:translateX(-50%) rotate(-3deg);pointer-events:none}.polaroid-photo{width:100%;aspect-ratio:1;overflow:hidden;background:linear-gradient(135deg,var(--lav),var(--sea));display:flex;align-items:center;justify-content:center}.polaroid-photo img{width:100%;height:100%;object-fit:cover;display:block}.fallback-initial{font-weight:700;color:#140e268c}.polaroid-caption{margin-top:8px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.modal-backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:#0a0814b8;opacity:0;pointer-events:none;transition:opacity .2s}.modal-backdrop.show{opacity:1;pointer-events:auto}.modal{width:100%;max-width:480px;max-height:82vh;overflow-y:auto;padding:28px 24px 36px;background:linear-gradient(160deg,#fffdf8,#f2e8d2);border-radius:24px 24px 0 0}.modal .num{text-align:center;font-size:22px;font-weight:700;margin:0 0 14px}.modal-photo{width:140px;height:140px;margin:0 auto 16px;overflow:hidden;border-radius:2px}.modal-photo img{width:100%;height:100%;object-fit:cover}.hidden{display:none!important}.field-label{font-size:14px;font-weight:700;margin:0 0 6px}.message,.track-note{font-size:14px;line-height:1.6;white-space:pre-wrap}.media-block{margin-bottom:16px}.media-block iframe{width:100%;border:0;border-radius:12px}.song-link{color:var(--accent);font-size:13px}.modal audio{width:100%}.close-btn{display:block;margin:20px auto 0;border:0;border-radius:999px;padding:10px 24px;background:#2e2a2414;color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<div class="intro-screen" id="introScreen" role="button" tabindex="0" aria-label="Tap to continue"><div class="intro-content"><p class="intro-text" id="introText"></p><div class="intro-dots" id="introDots"></div><div class="intro-footer"><button class="intro-back" id="introBack" type="button" aria-label="Go back">←</button><p class="intro-hint" id="introHint">tap to continue</p><button class="intro-skip" id="introSkip" type="button">skip to end</button></div></div></div>
<header class="hero"><h1>25 for 25</h1><p id="heroSub">happy birthday riazul!</p></header>
<div class="field" id="field"></div><section class="bonus-section"><p class="bonus-text">ok i know i said 25 but there are too many people who love you so here's a little bonus from your family</p><div class="field" id="bonusField"></div></section>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalNum"><p class="num" id="modalNum"></p><div class="modal-photo hidden" id="modalPhoto"></div><div id="modalVoiceSection" class="hidden"><p class="field-label">a birthday wish:</p><div id="modalVoiceSlot"></div></div><p class="field-label">a treasured memory:</p><p class="message" id="modalMemoryText"></p><div id="modalMedia"></div><button class="close-btn" id="modalClose">Close</button></div></div>

    {"name":"hamza","memory":"i think my favourite memory with you was actually the collection of different times we visited the sky views in japan. big ups riazul for overcoming your fears.","song":"https://open.spotify.com/track/3zpGIFghtnVlwMXWyKW474?si=91fd4835ff3b4739","trackNote":"this is the song that reminds me most of our friendship","voice":""},
    {"name":"hazel","memory":"genuinely my favourite memory is our double podiums. they are honestly both in my top 10 classes ever taught and I couldn’t have imagined doing them with anyone else 🫶🏻","song":"https://open.spotify.com/track/0NTMtAO2BV4tnGvw9EgBVq?si=85e73454a8e34ac1","trackNote":"(you know the remix)","voice":""},
    {"name":"jen","memory":"my favourite memory of Riazul is actually the first time I met him. I was really close to leaving Psycle because I missed Alana’s warmth, heart and the way she made me feel so supported in the room. I decided I’d try one last coach before cancelling my membership, and that was Riazul. he was still quite new and a little unpolished, but there was something so special about him straight away. I felt that same warmth, encouragement and genuine support that I’d been missing, and I remember thinking, this is exactly why I loved coming here in the first place. he reignited my love for the modality and I’ve ridden with him ever since, and watching him grow into the coach he is now has made that first class feel even more special.","song":"https://open.spotify.com/track/25DgjoTlKK8KjstM4cZ8L2?si=134a5baa8e5f4c87","trackNote":"you won't know this but, I had this on repeat heading into my surprise epilepsy diagnosis. as I left and sobbed on the train it was playing the whole way home without me even registering. 48h later I'm sat in PH trying to forget about everything and this track plays, and you're talking about how we're already over the hardest hurdle and everything gets easier from here. you had no idea of the irony here, but it changed my perspective.","voice":""},
    {"name":"katsie","memory":"trauma bonding in the swifty sixties!!!! my first power hour on that silly side bike and riazul coming over mid weights track being like NO YOU GOTS THIS.","song":"https://open.spotify.com/track/3hUxzQpSfdDqwM3ZTFQY0K","trackNote":"has to be taylor swift so sorry but gonna go for august","voice":""},

    {"name":"mel","memory":"M&S picky bits one summer's day in st. paul's with the rest of the crew is a wholesome memory. but your shirt rip mid-way in class will always remain iconic - slay!","song":"https://open.spotify.com/track/2YmJZWGcy0yONMCsEKOuVD?si=bce89485d4ac470b","trackNote":"i always think of this song when you coach us","voice":""},
    {"name":"mohim","memory":"my favourite memory of you was probably when you had the whole playground at school in Year 6 huddling around you, to watch you perform the cup song. you might not know it but I’ve seen you always put yourself out there and just do stuff that no one else would even think to do and it’s one thing I admire about you a lot. violin, the Ukelele incident, Annie, becoming the stock image running person for Mile End and to Psycle today you truly are the GOAT of the off beaten path and a great example of what it means to be an ambassador of just loving to live.","song":"https://open.spotify.com/track/6GyFP1nfCDB8lbD2bG0Hq9?si=e1d418786daa4635","trackNote":"","voice":""},
    {"name":"perdi","memory":"most uplifting person and creates the safest of spaces!!!","song":"https://open.spotify.com/track/6AtZLIzUINvExIUy4QhdjP?si=d116ea75f47147a7","trackNote":"a song that reminds me of you is I knew you were trouble as you tried to kill me with that song xoxo","voice":""},
    {"name":"peter","memory":"when we devoured that whack banger of a fried chicken, gizzards, and fries (IYKYK)","song":"https://open.spotify.com/track/44MuEHdlociG8KjhPhOVw5?si=55d0e6028e344f16","trackNote":"this was the song that played in bluey and I have a video of us grooving to it","voice":""},
    {"name":"shanti","memory":"when we were in academy and I was being yelled at to make eye contact with you + compliment you. I clearly couldn't do it so I yelled 'ride faster' at you. think gasolinas was playing in the background idk x","song":"https://open.spotify.com/track/3KliPMvk1EvFZu9cvkj8p1?si=41bfde7d01ac43e2","trackNote":"I remember that was your first power push in academy that was kinda slay","voice":""},
    {"name":"soph","memory":"how could this be anything other than the first time we met, when I walked into the ride studio and just laughed at you. I think you would have been disappointed if I had said anything else, and I just think it set the tone for our friendship perfectly :)","song":"https://open.spotify.com/track/5Y6a6AaahaBi5ljf6hk7dF?si=ebe2b9589986478a","trackNote":"yktv 💥🚀🫡","voice":""},
    {"name":"steph","memory":"the fear of god in your eyes when you found out what the 12th amendment was.","song":"https://open.spotify.com/track/3O5osWf1rSoKMwe6E9ZaXP?si=6964ec5b4d5d4bb5","trackNote":"(threatening) (fuck you)","voice":""},
    {"name":"tala","memory":"core memory is when i realised i was going to be riding podium like 2 minutes before class and the little party hat headband fighting for its life (and failing) to stay on our heads during the combo LOL. that class was so silly and special i will remember it for a long long time!!","song":"https://open.spotify.com/track/6ie2Bw3xLj2JcGowOlcMhb?si=0f45d4d82b7b485c","trackNote":"okay i didn't just pick this because you've played it a bunch recently (eats every time btw) BUT i vividly remember you playing this ages ago and it being like the first time i actually wanted to get up during a run lmao (i also tried to find the elizabeth taylor x backstreet boys remix that broke the sound system in nh that one time but failed so here we are)","voice":""},
    {"name":"vi","memory":"picking one memory is like picking drake or kendrick (I know where you stand) but I'll go with the fire alarm 10 minutes into class and for the first solid minutes of the fire alarm going everyone not knowing whether it was a drill, what to do, whether to go outside or not and then proceeding to stand on the pavements of oxford street dripping in sweat and in socks being stared at by bystanders like zoo animals HAHA","song":"https://open.spotify.com/track/2xLMifQCjDGFmkHkpNLD9h?si=06161f7b4bc04a24","trackNote":"song that reminds me most of our friendship: sicko mode - travis scott ft drake (10 hour version). waving to you at tottenham stadium during travis' show and experiencing that live together and then getting to dance to him on a bike every week is so sick(o mode)","voice":""},
    {"name":"vivienne","memory":"has to be either our double podium at psycle bank - especially your unexpected speech (and emotion) about our friendship - OR you once added not 2 but 3 weight tracks in your PH. your faith in us is honestly... inspirational.","song":"https://open.spotify.com/track/3lKZf71jeNi14udIFPJ29V?si=cb50fa7ead444048","trackNote":"(weight track) stare me in the eyes yelling FUCK YOU I KNOW YOU WERE TROUBLE","voice":""},
    {"name":"zeshan","memory":"when you taught the brown game strong class. you looked so happy to teach a class with those songs in front of so many south asians. it was wonderful to see.","song":"https://open.spotify.com/track/4kte3OcW800TPvOVgrLLj8?si=321604a046f04715","trackNote":"when this has played in PH the duet going on is magical","voice":""}

    {"name":"nazma","memory":"happy birthday!!! I have too many favourites memories of us, but one that’s super clear in my head is the first time I saw you up on the podium doing your spin class! I was so proud of you, I feel like that moment represented so much more than a new job; to me it represented growth, new beginnings, and opportunities. I look forward to joining more of your spin classes and look forward to seeing how to continue to push past the boundaries and achieve above and beyond.","song":"","trackNote":"","voice":""},

<script>
(function(){'use strict';
const PHOTO_FOLDER='photos/',VOICE_FOLDER='voice/',fallback='Write their favourite memory here.';
function text(value,defaultValue=''){return typeof value==='string'?value:defaultValue;}
function normalize(entry,index,group){const value=entry&&typeof entry==='object'?entry:{};return{name:text(value.name,group+'-'+(index+1)).trim()||group+'-'+(index+1),memory:text(value.memory,fallback),song:text(value.song),trackNote:text(value.trackNote),voice:text(value.voice)};}
function load(group){try{const data=JSON.parse(document.getElementById('peopleData').textContent||'{}');return Array.isArray(data[group])?data[group].map((entry,index)=>normalize(entry,index,group.slice(0,-1))):[];}catch(error){console.error('Could not load peopleData',error);return[];}}
const FRIENDS=load('friends'),FAMILY=load('family');
const intro=['hey riazul',"a little birdie told me you're 25","how's that pre-frontal cortex feeling?",'you don’t have to answer that.','anyway...','it turns out some friends and loved ones have birthday wishes to share with you...','25 to be exact','if you just said "wtf" for the tenth time, we’re right on track','anyway, ON TO THE MESSAGES!','oh and -','happy birthday baby boy. we love you so endlessly and cannot wait to cheer you on in all the amazing things you’ll do in your next lap around the sun.'];
const screen=document.getElementById('introScreen'),introText=document.getElementById('introText'),introHint=document.getElementById('introHint'),dots=document.getElementById('introDots'),back=document.getElementById('introBack'),skip=document.getElementById('introSkip');let introIndex=0;intro.forEach((_,i)=>{const dot=document.createElement('span');dot.className=i===0?'active':'';dots.appendChild(dot);});function renderIntro(){introText.textContent=intro[introIndex];introHint.textContent=introIndex===intro.length-1?'tap to open your messages':'tap to continue';Array.from(dots.children).forEach((dot,i)=>dot.classList.toggle('active',i===introIndex));back.classList.toggle('visible',introIndex>0);}function step(next){introIndex=next;renderIntro();}screen.addEventListener('click',event=>{if(event.target===back||event.target===skip)return;if(introIndex<intro.length-1)step(introIndex+1);else screen.classList.add('hidden');});back.addEventListener('click',event=>{event.stopPropagation();if(introIndex>0)step(introIndex-1);});skip.addEventListener('click',event=>{event.stopPropagation();screen.classList.add('hidden');});screen.addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key==='Enter'||event.key===' '){event.preventDefault();if(introIndex<intro.length-1)step(introIndex+1);else screen.classList.add('hidden');}else if(event.key==='ArrowLeft'&&introIndex>0)step(introIndex-1);});renderIntro();
function escapeHtml(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');}
function spotifyEmbed(url){const m=url.match(/open\.spotify\.com\/(track|album|playlist)\/([a-zA-Z0-9]+)/);if(!m)return null;return '<iframe src="https://open.spotify.com/embed/'+m[1]+'/'+m[2]+'" height="80" allow="encrypted-media"></iframe>';}
function youtubeEmbed(url){let id=null;let m=url.match(/youtu\.be\/([a-zA-Z0-9_-]+)/);if(m)id=m[1];if(!id){m=url.match(/[?&]v=([a-zA-Z0-9_-]+)/);if(m)id=m[1];}if(!id){m=url.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]+)/);if(m)id=m[1];}if(!id)return null;return '<iframe src="https://www.youtube.com/embed/'+id+'" height="200" allow="autoplay; encrypted-media"></iframe>';}
function attachPhoto(container,name,suffix,optional){const image=document.createElement('img');image.alt=name;const extensions=['jpg','jpeg','png','webp'];let attempt=0;function next(){if(attempt>=extensions.length){image.remove();if(optional)container.classList.add('hidden');else{const initial=document.createElement('span');initial.className='fallback-initial';initial.textContent=(name.charAt(0)||'?').toUpperCase();container.appendChild(initial);}return;}image.src=PHOTO_FOLDER+encodeURIComponent(name+suffix)+'.'+extensions[attempt++];}image.addEventListener('error',next);container.appendChild(image);next();}
function attachVoice(section,slot,item){const audio=document.createElement('audio');audio.controls=true;slot.appendChild(audio);if(item.voice){audio.src=item.voice;return;}const extensions=['mp3','m4a','wav','ogg'];let attempt=0;function next(){if(attempt>=extensions.length){section.classList.add('hidden');return;}audio.src=VOICE_FOLDER+encodeURIComponent(item.name.toLowerCase())+'.'+extensions[attempt++];}audio.addEventListener('error',next);next();}
function buildMedia(item){let html='<p class="field-label">a meaningful track:</p>';if(item.trackNote)html+='<p class="track-note">'+escapeHtml(item.trackNote)+'</p>';if(item.song){const embed=spotifyEmbed(item.song)||youtubeEmbed(item.song);if(embed){html+='<div class="media-block">'+embed+'</div>';}else{html+='<div class="media-block"><a class="song-link" href="'+escapeHtml(item.song)+'" target="_blank" rel="noopener">Listen to the song ♫</a></div>';}}return html;}
const backdrop=document.getElementById('modalBackdrop'),modalNum=document.getElementById('modalNum'),modalPhoto=document.getElementById('modalPhoto'),voiceSection=document.getElementById('modalVoiceSection'),voiceSlot=document.getElementById('modalVoiceSlot'),memoryText=document.getElementById('modalMemoryText'),media=document.getElementById('modalMedia');function openItem(item){modalNum.textContent=item.name;modalPhoto.innerHTML='';modalPhoto.classList.remove('hidden');attachPhoto(modalPhoto,item.name,'2',true);voiceSlot.innerHTML='';voiceSection.classList.remove('hidden');attachVoice(voiceSection,voiceSlot,item);memoryText.textContent=item.memory;media.innerHTML=buildMedia(item);backdrop.classList.add('show');}function closeModal(){backdrop.classList.remove('show');}document.getElementById('modalClose').addEventListener('click',closeModal);backdrop.addEventListener('click',event=>{if(event.target===backdrop)closeModal();});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal();});
function buildWall(container,list){list.forEach((item,index)=>{const button=document.createElement('button');button.className='polaroid';button.type='button';button.setAttribute('aria-label','Open '+item.name+' photo');button.addEventListener('click',()=>openItem(item));const photo=document.createElement('span');photo.className='polaroid-photo';attachPhoto(photo,item.name,'1',false);const caption=document.createElement('span');caption.className='polaroid-caption';caption.textContent=item.name;button.append(photo,caption);button.style.transform='rotate('+(Math.sin(index*17.233)*4)+'deg)';container.appendChild(button);});}
document.getElementById('heroSub').textContent='happy birthday riazul!';buildWall(document.getElementById('field'),FRIENDS);buildWall(document.getElementById('bonusField'),FAMILY);
})();
</script>
</body>
</html>
