<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>riri's 25 for 25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
 
  :root{
    --bg-1: #fffaf0;
    --bg-2: #fffaf0;
    --card: #fffdf8;
    --ink: #2e2a24;
    --ink-dim: rgba(46,42,36,0.6);
    --coral: #ff8c69;
    --gold: #ffc857;
    --rose: #ff6f91;
    --seafoam: #5fd1c0;
    --lavender: #b296ff;
    --accent: #2f7d6f;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--bg-1);
    color: var(--ink);
    font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  h1, h2, .display{
    font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  .intro-screen{
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 28px;
    background: var(--bg-1);
    cursor: pointer;
    transition: opacity 0.30s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .intro-screen.hidden{
    opacity: 0;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce){
    .intro-screen{ transition: none; }
  }

  .intro-content{
    width: 100%;
    max-width: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .intro-text{
    font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: clamp(1rem, 4.5vw, 1.3rem);
    font-weight: 500;
    line-height: 1.45;
    width: 100%;
    text-align: center;
    margin: 0;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .intro-text.fade{
    opacity: 0;
    transform: translateY(12px);
  }

  @media (prefers-reduced-motion: reduce){
    .intro-text{ transition: none; }
  }

  .intro-dots{
    display: flex;
    gap: 6px;
    margin-top: 22px;
  }

  .intro-dots span{
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(46,42,36,0.18);
  }

  .intro-dots span.active{
    background: var(--ink);
  }

  .intro-footer{
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 26px;
    margin-top: 22px;
  }

  .intro-back{
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 16px;
    line-height: 1;
    padding: 6px;
    margin: 0;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .intro-back.visible{
    opacity: 1;
    pointer-events: auto;
  }

  .intro-skip{
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 11px;
    line-height: 1;
    padding: 6px;
    margin: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .intro-skip:hover,
  .intro-skip:focus-visible{
    color: var(--ink);
  }

  .intro-hint{
    margin: 0;
    font-size: 11px;
    color: var(--ink-dim);
    text-align: center;
  }

  @media (min-width: 640px){
    .intro-content{ max-width: 380px; }
  }

  .hero{
    padding: 48px 20px 20px;
    text-align: center;
  }

  .hero .eyebrow{
    font-size: 11px;
    color: var(--ink-dim);
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }

  .hero h1{
    font-size: clamp(1.6rem, 8vw, 2.4rem);
    font-weight: 700;
    line-height: 1;
    margin: 0;
    color: var(--ink);
  }

  .hero p.sub{
    max-width: 260px;
    margin: 10px auto 0;
    font-size: 12px;
    color: var(--ink-dim);
    line-height: 1.5;
  }

  .field{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px 14px;
    width: 100%;
    max-width: 720px;
    margin: 28px auto 0;
    padding: 0 4px 48px;
  }

  @media (min-width: 480px) and (max-width: 639px){
    .field{ grid-template-columns: repeat(4, 1fr); }
  }

  @media (min-width: 640px){
    .field{
      grid-template-columns: repeat(5, 1fr);
      gap: 30px 22px;
      margin-top: 36px;
    }
  }

  .bonus-section{
    margin-top: 100px;
    padding: 0 24px;
  }

  .bonus-text{
    max-width: 480px;
    margin: 0 auto;
    text-align: center;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--ink);
  }

  @media (min-width: 640px){
    .bonus-section{ margin-top: 140px; }
    .bonus-text{ font-size: 18px; max-width: 540px; }
  }

  .polaroid{
    position: relative;
    width: 100%;
    background: var(--card);
    border: 1px solid rgba(46,42,36,0.06);
    border-radius: 3px;
    padding: 7px 7px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    box-shadow:
      0 1px 1px rgba(35,25,10,0.22),
      0 8px 12px -4px rgba(35,25,10,0.28),
      0 22px 34px -12px rgba(35,25,10,0.4);
    -webkit-tap-highlight-color: transparent;
  }

  .polaroid::before{
    content: "";
    position: absolute;
    top: -9px;
    left: 50%;
    width: 42px;
    height: 15px;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 3px 4px rgba(35,25,10,0.18);
    transform: translateX(-50%) rotate(-3deg);
    pointer-events: none;
  }

  .polaroid:active{ filter: brightness(0.97); }

  .polaroid:focus-visible{
    outline: 3px solid var(--ink);
    outline-offset: 3px;
  }

  .polaroid-photo{
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 1px;
    background: linear-gradient(135deg, var(--lavender), var(--seafoam));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .polaroid-photo img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .polaroid-photo .fallback-initial{
    font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 700;
    color: rgba(20,14,38,0.55);
  }

  .polaroid-caption{
    margin-top: 8px;
    font-size: 10px;
    font-weight: 600;
    color: var(--ink);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .polaroid.opened{
    opacity: 0.55;
  }

  .polaroid.opened::after{
    content: "";
    position: absolute;
    bottom: 7px;
    right: 9px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--ink);
  }

  .modal-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(10,8,20,0.72);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .modal-backdrop.show{
    opacity: 1;
    pointer-events: auto;
  }

  .modal{
    background: linear-gradient(160deg, #fffdf8, #f2e8d2);
    width: 100%;
    max-width: 480px;
    border-radius: 24px 24px 0 0;
    padding: 28px 24px 36px;
    transform: translateY(24px);
    transition: transform 0.25s ease;
    max-height: 82vh;
    overflow-y: auto;
    box-shadow: 0 -8px 30px rgba(35,25,10,0.25);
  }

  .modal-backdrop.show .modal{
    transform: translateY(0);
  }

  .modal .num{
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    text-align: center;
    margin: 0 0 14px;
  }

  .modal-photo{
    width: 140px;
    height: 140px;
    margin: 0 auto 16px;
    border-radius: 6px;
    overflow: hidden;
    background: linear-gradient(135deg, var(--lavender), var(--seafoam));
  }

  .modal-photo img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .modal-photo.hidden{
    display: none;
  }

  .field-label{
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 6px;
  }

  .modal-voice{
    margin-bottom: 18px;
  }

  .modal-voice.hidden{
    display: none;
  }

  .modal p.message{
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 18px;
    white-space: pre-wrap;
    color: var(--ink);
  }

  .modal .media-block{
    margin-bottom: 16px;
  }

  .modal .media-block iframe{
    width: 100%;
    border: none;
    border-radius: 12px;
  }

  .modal a.song-link{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
  }

  .modal audio{
    width: 100%;
  }

  .modal .close-btn{
    display: block;
    margin: 20px auto 0;
    background: rgba(46,42,36,0.08);
    color: var(--ink);
    border: none;
    padding: 10px 24px;
    border-radius: 999px;
    font-size: 12px;
    font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    cursor: pointer;
  }

  .empty-note{
    color: var(--ink-dim);
    font-style: italic;
    font-size: 13px;
  }

  @media (min-width: 640px){
    .hero{ padding: 72px 20px 24px; }
    .hero p.sub{ max-width: 340px; font-size: 13px; }

    .modal-backdrop{ align-items: center; }
    .modal{
      border-radius: 24px;
      transform: translateY(12px) scale(0.98);
    }
    .modal-backdrop.show .modal{ transform: translateY(0) scale(1); }
    .modal p.message{ font-size: 15px; }
    .field-label{ font-size: 15px; }
  }

</style>
</head>
<body>

  <div class="intro-screen" id="introScreen" role="button" tabindex="0" aria-label="Tap to continue">
    <div class="intro-content">
      <p class="intro-text" id="introText"></p>
      <div class="intro-dots" id="introDots"></div>
      <div class="intro-footer">
        <button class="intro-back" id="introBack" type="button" aria-label="Go back">←</button>
        <p class="intro-hint" id="introHint">tap to continue</p>
        <button class="intro-skip" id="introSkip" type="button" aria-label="Skip intro">skip to end</button>
      </div>
    </div>
  </div>

  <div class="hero">
    <h1 id="heroName" class="display">25 for 25</h1>
    <p class="sub" id="heroSub">happy birthday riazul!</p>
  </div>

  <div class="field" id="field"></div>

  <div class="bonus-section">
    <p class="bonus-text">ok i know i said 25 but there are too many people who love you so here's a little bonus from your family</p>
    <div class="field" id="bonusField"></div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalNum">
      <p class="num" id="modalNum"></p>
      <div class="modal-photo hidden" id="modalPhoto"></div>
      <div class="modal-voice hidden" id="modalVoice">
        <p class="field-label">a birthday wish:</p>
        <audio id="voiceAudio" controls style="width: 100%;"></audio>
      </div>
      <p class="message" id="modalMessage"></p>
      <div class="field-label" id="memoryLabel" style="display: none;">a treasured memory:</div>
      <div class="media-block" id="modalMedia"></div>
      <button class="close-btn" id="modalClose">Close</button>
    </div>
  </div>

  <script>
    // Data structure to store entries
    const entries = [
      { id: 1, name: "alina", type: "photo", photo: "photos/alina1.jpeg" },
      { id: 2, name: "katsie", type: "photo", photo: "photos/katsie2.jpg" },
      { id: 3, name: "noah 1", type: "photo", photo: "photos/noah1.jpeg" },
      { id: 4, name: "noah 2", type: "photo", photo: "photos/noah2.jpeg", voice: "voice/noah.m4a", memory: "you're the best. (in the most annoying way possible.)" },
      { id: 5, name: "steph 1", type: "photo", photo: "photos/steph1.jpeg" },
      { id: 6, name: "steph 2", type: "photo", photo: "photos/steph2.jpeg" },
      { id: 7, name: "zeshan", type: "photo", photo: "photos/zeshan1.jpg" },
    ];

    const introTexts = [
      "happy 25th birthday to riazul amina khan! 🎂",
      "we're so incredibly proud of you.",
      "here are 25 reasons why (but really there are way more):",
    ];

    let currentIntroIndex = 0;
    let isAnimating = false;

    const introScreen = document.getElementById('introScreen');
    const introText = document.getElementById('introText');
    const introDots = document.getElementById('introDots');
    const introBack = document.getElementById('introBack');
    const introSkip = document.getElementById('introSkip');
    const field = document.getElementById('field');
    const bonusField = document.getElementById('bonusField');

    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalNum = document.getElementById('modalNum');
    const modalPhoto = document.getElementById('modalPhoto');
    const modalMessage = document.getElementById('modalMessage');
    const modalMedia = document.getElementById('modalMedia');
    const modalClose = document.getElementById('modalClose');
    const modalVoice = document.getElementById('modalVoice');
    const voiceAudio = document.getElementById('voiceAudio');
    const memoryLabel = document.getElementById('memoryLabel');

    function initIntro() {
      createIntroDots();
      showIntroText();
      introScreen.addEventListener('click', nextIntroText);
      introBack.addEventListener('click', prevIntroText);
      introSkip.addEventListener('click', skipIntro);
    }

    function createIntroDots() {
      introDots.innerHTML = '';
      introTexts.forEach((_, i) => {
        const dot = document.createElement('span');
        if (i === 0) dot.classList.add('active');
        introDots.appendChild(dot);
      });
    }

    function showIntroText() {
      if (currentIntroIndex < introTexts.length) {
        introText.textContent = introTexts[currentIntroIndex];
        introText.classList.remove('fade');
        updateIntroDots();
        introBack.classList.toggle('visible', currentIntroIndex > 0);
      }
    }

    function updateIntroDots() {
      const dots = introDots.querySelectorAll('span');
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIntroIndex);
      });
    }

    function nextIntroText() {
      if (isAnimating) return;
      isAnimating = true;
      if (currentIntroIndex < introTexts.length - 1) {
        introText.classList.add('fade');
        setTimeout(() => {
          currentIntroIndex++;
          showIntroText();
          isAnimating = false;
        }, 150);
      } else {
        skipIntro();
      }
    }

    function prevIntroText(e) {
      e.stopPropagation();
      if (isAnimating) return;
      isAnimating = true;
      if (currentIntroIndex > 0) {
        introText.classList.add('fade');
        setTimeout(() => {
          currentIntroIndex--;
          showIntroText();
          isAnimating = false;
        }, 150);
      }
    }

    function skipIntro() {
      introScreen.classList.add('hidden');
      renderCards();
    }

    function renderCards() {
      field.innerHTML = '';
      entries.forEach((entry) => {
        const card = createCard(entry);
        field.appendChild(card);
      });
    }

    function createCard(entry) {
      const card = document.createElement('button');
      card.className = 'polaroid';
      card.setAttribute('type', 'button');

      const photoDiv = document.createElement('div');
      photoDiv.className = 'polaroid-photo';

      if (entry.photo) {
        const img = document.createElement('img');
        img.src = entry.photo;
        img.alt = entry.name;
        img.onerror = () => {
          photoDiv.innerHTML = `<span class="fallback-initial">${entry.name.charAt(0).toUpperCase()}</span>`;
        };
        photoDiv.appendChild(img);
      }

      const caption = document.createElement('p');
      caption.className = 'polaroid-caption';
      caption.textContent = entry.name;

      card.appendChild(photoDiv);
      card.appendChild(caption);

      card.addEventListener('click', () => openModal(entry, card));

      return card;
    }

    function openModal(entry, card) {
      card.classList.add('opened');
      modalNum.textContent = `#${entry.id}`;
      modalPhoto.classList.add('hidden');
      modalMessage.textContent = '';
      modalMedia.innerHTML = '';
      modalVoice.classList.add('hidden');
      memoryLabel.style.display = 'none';

      if (entry.photo) {
        modalPhoto.classList.remove('hidden');
        const img = document.createElement('img');
        img.src = entry.photo;
        img.alt = entry.name;
        modalPhoto.innerHTML = '';
        modalPhoto.appendChild(img);
      }

      if (entry.voice) {
        modalVoice.classList.remove('hidden');
        voiceAudio.src = entry.voice;
      }

      if (entry.memory) {
        memoryLabel.style.display = 'block';
        modalMessage.textContent = entry.memory;
      }

      modalBackdrop.classList.add('show');
    }

    function closeModal() {
      modalBackdrop.classList.remove('show');
      document.querySelectorAll('.polaroid').forEach(card => {
        card.classList.remove('opened');
      });
    }

    modalClose.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) closeModal();
    });

    // Initialize
    initIntro();
  </script>
</body>
</html>
